[tool.ruff]
# Line length (black compatible)
line-length = 88

# Target Python version
target-version = "py311"

[tool.ruff.format]
# Use spaces for indentation
indent-style = "space"

# Compatible with black
quote-style = "double"

[tool.ruff.lint]
# Enable flake8 and other rule sets
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]

# Ignore some rules that might be too strict for now
ignore = ["E501", "B008", "UP045"]

# Allow fixes for these rules
fixable = ["ALL"]
