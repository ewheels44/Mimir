[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimir"
version = "0.1.0"
description = "Persistent knowledge base for AI agents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp>=1.0.0",
    "llama-index>=0.11.0",
    "llama-index-embeddings-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mimir*"]
exclude = ["experiments*"]

[tool.setuptools.package-dir]
"" = "src"

[project.scripts]
mimir = "mimir:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mimir]
# Default configuration
default_embedding_model = "text-embedding-3-large"
default_llm_model = "o3-mini"
default_docs_dir = "docs"
default_knowledge_dir = ".knowledge/llamaindex"
default_code_dirs = ["langgraph", "src", "tests", "scripts", "workflows", "web"]
