[project]
name = "mimir-knowledge"
version = "0.1.0"
description = "Multi-project knowledge base MCP server using LlamaIndex"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "llama-index>=0.11.0",
    "llama-index-embeddings-openai>=0.2.0",
    "llama-index-llms-openai-like>=0.1.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
]
dev = [
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
