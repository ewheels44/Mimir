# Memory Schema - Three-Layer AI Context System
# T4: Memory schema and metadata layer design
version: "1.0"

memory_types:
  - preference
  - decision
  - convention
  - episodic
  - correction

fields:
  id:
    type: string
    required: true
    description: "Unique identifier (UUID format)"
    format: uuid

  content:
    type: string
    required: true
    description: "The actual memory content"

  type:
    type: enum
    required: true
    values:
      - preference
      - decision
      - convention
      - episodic
      - correction
    description: "Category of memory"

  confidence:
    type: number
    required: true
    description: "Confidence score from 0.0 to 1.0"
    minimum: 0.0
    maximum: 1.0

  source_session:
    type: string
    required: true
    description: "Session ID where this memory was created"

  created_at:
    type: datetime
    required: true
    description: "ISO 8601 timestamp of creation"

  last_used_at:
    type: datetime
    required: true
    description: "ISO 8601 timestamp of last access"

  decay_weight:
    type: number
    required: false
    default: 1.0
    description: "Weight for decay calculation"
    minimum: 0.0

  expires_at:
    type: datetime
    required: false
    description: "ISO 8601 timestamp when memory expires (optional)"

  status:
    type: enum
    required: false
    default: "active"
    values:
      - active
      - decayed
      - archived
    description: "Current state of the memory"