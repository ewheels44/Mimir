# Qdrant Local Configuration
# Three-Layer AI Context System - T5

version: "1.0"

# Local on-disk mode configuration
local_mode: true
path: ".mimir/qdrant"

# Collection configurations
collections:
  - name_template: "{project_name}_memories"
    vector_size: 1536  # OpenAI text-embedding-3-small
    distance: "Cosine"
    hnsw_config:
      m: 16
      ef_construct: 100

  - name_template: "{project_name}_graph_nodes"
    vector_size: 1536
    distance: "Cosine"
    hnsw_config:
      m: 16
      ef_construct: 100